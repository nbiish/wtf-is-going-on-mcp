[package]
name = "wtf"
version = "0.21.0"
edition = "2021"
description = "wtf: stateless zero-dependency SSH/local fleet status, goals, and pickup CLI"
publish = false

# Zero external dependencies by design.
[dependencies]

[[bin]]
name = "wtf"
path = "src/main.rs"

[lib]
name = "wtf"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.dev]
overflow-checks = true
