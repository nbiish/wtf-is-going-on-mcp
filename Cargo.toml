[package]
name = "wtf-live"
version = "1.0.0"
edition = "2021"
description = "wtf-live: one localhost view of every cross-machine agent session (Herdr + Orca CLI)"
publish = false

# Zero external dependencies by design: std only, one static binary.
[dependencies]

[[bin]]
name = "wtf-live"
path = "src/main.rs"

[lib]
name = "wtf_live"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.dev]
overflow-checks = true
