<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wtf·live — cross-machine agents</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#11151a; --panel2:#171c23; --line:#232a33;
    --ink:#e6edf3; --dim:#8b98a5; --faint:#5b6672;
    --ok:#3fb950; --busy:#d29922; --block:#f85149; --idle:#58a6ff;
    --accent:#7ee787; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--idle);text-decoration:none}

  header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:8px;font-family:var(--mono)}
  .brand b{font-size:17px;letter-spacing:-.5px}
  .brand span{color:var(--dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .counts{display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--dim)}
  .counts b{color:var(--ink);font-weight:600}
  .grow{flex:1}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
    background:var(--panel);border-radius:999px;padding:3px 9px;font-size:11px;
    font-family:var(--mono);color:var(--dim);cursor:default}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .pill.up .dot{background:var(--ok)}
  .pill.down .dot{background:var(--block)}
  .tools{display:flex;align-items:center;gap:8px}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:6px 10px;font:12px var(--mono);width:200px;outline:none}
  input[type=search]:focus{border-color:#3b4a5a}
  .btn{background:var(--panel);border:1px solid var(--line);border-radius:7px;
    padding:6px 10px;font-size:12px;cursor:pointer}
  .btn:hover{background:var(--panel2)}
  .btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .btn.primary:hover{background:#2b7ff5}
  .btn.ghost{background:transparent}

  main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;height:calc(100vh - 53px)}
  aside{border-right:1px solid var(--line);overflow:auto;padding:14px}
  section.content{overflow:auto;padding:16px 18px 60px}
  h2{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:0 0 10px}

  .machine{border:1px solid var(--line);border-radius:9px;background:var(--panel);
    padding:9px 10px;margin-bottom:8px;cursor:pointer}
  .machine:hover{border-color:#33404e}
  .machine.sel{border-color:#2f81f7;background:#0f1a28}
  .machine .row{display:flex;align-items:center;gap:7px}
  .machine .name{font-family:var(--mono);font-size:12.5px;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .machine .meta{color:var(--dim);font-size:11px;margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
  .dot.working{background:var(--busy);box-shadow:0 0 0 3px rgba(210,153,34,.15)}
  .dot.blocked{background:var(--block);box-shadow:0 0 0 3px rgba(248,81,73,.15)}
  .dot.done{background:var(--ok)}
  .dot.idle{background:var(--idle)}
  .dot.shell,.dot.unknown{background:var(--faint)}

  .bins{margin-top:18px}
  .bin{border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:6px;
    cursor:pointer;background:var(--panel)}
  .bin:hover{border-color:#33404e}
  .bin .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .bin .m{color:var(--faint);font:10.5px var(--mono);margin-top:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
  .card{border:1px solid var(--line);border-radius:11px;background:var(--panel);
    padding:12px;display:flex;flex-direction:column;gap:8px;min-height:150px}
  .card.busy{border-color:#4a3a12;background:linear-gradient(180deg,#171307,#11151a)}
  .card.blocked{border-color:#5a1f1c;background:linear-gradient(180deg,#1a0f0f,#11151a)}
  .card .top{display:flex;align-items:center;gap:7px}
  .card .agent{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
  .card .state{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .card .src{margin-left:auto;font:10px var(--mono);color:var(--faint);
    border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .card .title{font-size:13px;font-weight:600;line-height:1.35}
  .card .cwd{font:10.5px var(--mono);color:var(--faint);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;direction:rtl;text-align:left}
  .card pre{margin:0;background:#0a0c0f;border:1px solid #1c232b;border-radius:7px;
    padding:8px;font:11px/1.45 var(--mono);color:#b9c6d2;white-space:pre-wrap;
    word-break:break-word;max-height:150px;overflow:auto;flex:1}
  .card .foot{display:flex;align-items:center;gap:8px;color:var(--faint);
    font:10.5px var(--mono)}
  .card .foot .copy{margin-left:auto;background:transparent;border:1px solid var(--line);
    border-radius:5px;padding:2px 7px;font-size:10.5px;cursor:pointer;color:var(--dim)}
  .card .foot .copy:hover{color:var(--ink);border-color:#3b4a5a}

  .empty{color:var(--dim);border:1px dashed var(--line);border-radius:11px;
    padding:28px;text-align:center;font-size:13px}
  .empty code{font-family:var(--mono);color:var(--ink);background:var(--panel2);
    padding:1px 5px;border-radius:4px}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;z-index:50;padding:24px}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(820px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .modal header{position:static;background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 14px;display:flex;align-items:center;gap:10px}
  .modal header .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .modal header .m{font:10.5px var(--mono);color:var(--faint)}
  .modal .body{padding:14px;overflow:auto}
  .modal pre{margin:0;background:#0a0c0f;border:1px solid #1c232b;border-radius:8px;
    padding:12px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
  textarea{width:100%;min-height:240px;background:#0a0c0f;border:1px solid #1c232b;
    border-radius:8px;color:var(--ink);padding:10px;font:12px/1.5 var(--mono);
    resize:vertical;outline:none}
  textarea:focus{border-color:#3b4a5a}
  input.field{width:100%;background:#0a0c0f;border:1px solid #1c232b;border-radius:8px;
    color:var(--ink);padding:8px 10px;font:12px var(--mono);outline:none;margin-bottom:8px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;
    border-top:1px solid var(--line)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;font-size:12px;opacity:0;transition:opacity .18s;z-index:60}
  .toast.on{opacity:1}
  .spinner{width:8px;height:8px;border-radius:50%;background:var(--busy);
    animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}
  @media(max-width:820px){main{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><b>wtf·live</b><span>cross-machine agents</span></div>
    <div class="counts" id="counts"></div>
    <div class="grow"></div>
    <div class="pills" id="pills"></div>
    <div class="tools">
      <input type="search" id="filter" placeholder="/ filter" autocomplete="off" spellcheck="false">
      <button class="btn" id="pause">pause</button>
      <button class="btn primary" id="newpaste">+ paste</button>
    </div>
  </div>
</header>
<main>
  <aside>
    <h2>Machines</h2>
    <div id="machines"></div>
    <div class="bins">
      <h2>Pastebins <span id="bincount" style="color:var(--faint)"></span></h2>
      <div id="binlist"></div>
    </div>
  </aside>
  <section class="content">
    <div id="sessions"></div>
  </section>
</main>

<div class="overlay" id="viewer">
  <div class="modal">
    <header>
      <div class="t" id="v-title"></div>
      <div class="m" id="v-meta"></div>
      <div class="grow"></div>
      <button class="btn ghost" id="v-copy">copy</button>
      <button class="btn ghost" id="v-del">delete</button>
      <button class="btn" id="v-close">close</button>
    </header>
    <div class="body"><pre id="v-body"></pre></div>
  </div>
</div>

<div class="overlay" id="composer">
  <div class="modal">
    <header><div class="t">New paste</div><div class="grow"></div>
      <button class="btn" id="c-close">close</button></header>
    <div class="body">
      <input class="field" id="c-title" placeholder="title (optional)" maxlength="120">
      <textarea id="c-body" placeholder="paste anything — a spec, a log tail, a URL list"></textarea>
    </div>
    <div class="actions">
      <button class="btn" id="c-cancel">cancel</button>
      <button class="btn primary" id="c-save">save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { snap:null, bins:[], paused:false, filter:"", machine:"", timer:null, viewing:null };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const base = (p) => String(p||"").split("/").filter(Boolean).pop() || "";
const ago = (ms) => {
  if(!ms) return "—";
  const d = Date.now() - ms;
  if(d < 0) return "now";
  const s = Math.floor(d/1000);
  if(s < 60) return s + "s";
  const m = Math.floor(s/60); if(m < 60) return m + "m";
  const h = Math.floor(m/60); if(h < 24) return h + "h";
  return Math.floor(h/24) + "d";
};
const bytes = (n) => n < 1024 ? n + "B" : (n/1024).toFixed(1) + "K";

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 1600); }

async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("copied"); }
  catch(e){ toast("copy failed"); }
}

async function load(){
  try{
    const r = await fetch("/api/snapshot?fresh=0", {cache:"no-store"});
    state.snap = await r.json();
  }catch(e){ /* keep last snapshot */ }
  try{
    const r = await fetch("/api/bins", {cache:"no-store"});
    state.bins = (await r.json()).bins || [];
  }catch(e){}
  render();
}

function render(){
  const s = state.snap;
  if(!s) return;
  const c = s.counts || {};
  $("counts").innerHTML =
    `<span><b>${c.working ?? 0}</b> working</span>` +
    `<span><b>${c.sessions ?? 0}</b> sessions</span>` +
    `<span><b>${c.machines ?? 0}</b> machines</span>`;
  $("pills").innerHTML = (s.sources||[]).map(src =>
    `<span class="pill ${src.ok?"up":"down"}" title="${esc(src.detail)}">` +
    `<i class="dot"></i>${esc(src.name)}</span>`).join("");

  const byMachine = {};
  (s.sessions||[]).forEach(x => { (byMachine[x.machine] ||= []).push(x); });

  $("machines").innerHTML = (s.machines||[]).map(m => {
    const n = (byMachine[m.name]||[]).length;
    const busy = (byMachine[m.name]||[]).filter(x => x.state==="working"||x.state==="blocked").length;
    return `<div class="machine ${state.machine===m.name?"sel":""}" data-machine="${esc(m.name)}">
      <div class="row"><i class="dot ${m.available?"idle":"unknown"}"></i>
        <span class="name">${esc(m.name)}</span>
        <span style="margin-left:auto;color:var(--faint);font:10.5px var(--mono)">${n}</span></div>
      <div class="meta">${esc(m.kind)} · ${busy} busy · ${esc(m.detail)}</div>
    </div>`;
  }).join("") || `<div class="meta" style="color:var(--dim)">no machines</div>`;

  $("bincount").textContent = state.bins.length ? `(${state.bins.length})` : "";
  $("binlist").innerHTML = state.bins.map(b =>
    `<div class="bin" data-bin="${esc(b.id)}"><div class="t">${esc(b.title)}</div>
      <div class="m">${esc(b.machine||"local")} · ${bytes(b.bytes)} · ${ago(b.created_at)}</div></div>`
  ).join("") || `<div class="meta" style="color:var(--dim)">empty — paste something</div>`;

  const q = state.filter.toLowerCase();
  let rows = (s.sessions||[]).filter(x =>
    (!state.machine || x.machine === state.machine) &&
    (!q || [x.title,x.agent,x.cwd,x.detail,x.machine,x.state].join(" ").toLowerCase().includes(q)));

  $("sessions").innerHTML = rows.length ? `<div class="grid">` + rows.map(card).join("") + `</div>`
    : `<div class="empty">Nothing live${state.machine?" on "+esc(state.machine):""}.
       ${q?"No match for “"+esc(q)+"”.":""}<br><br>
       Start an agent in <code>herdr</code> or a worktree in Orca, then it appears here.</div>`;
}

function card(x){
  const cls = x.state === "working" ? "busy" : x.state === "blocked" ? "blocked" : "";
  return `<article class="card ${cls}">
    <div class="top"><i class="dot ${esc(x.state)}"></i>
      <span class="agent">${esc(x.agent)}</span>
      <span class="state">${esc(x.state)}</span>
      <span class="src">${esc(x.source)}</span></div>
    <div class="title">${esc(x.title)}</div>
    <div class="cwd" title="${esc(x.cwd)}">${esc(x.cwd || "—")}</div>
    <pre>${esc(x.detail || "no output yet")}</pre>
    <div class="foot"><span>${esc(x.machine)} · ${ago(x.updated_at)}</span>
      <button class="copy" data-copy="${esc(x.handle)}">copy id</button></div>
  </article>`;
}

// events
$("machines").addEventListener("click", e => {
  const el = e.target.closest("[data-machine]"); if(!el) return;
  const name = el.dataset.machine;
  state.machine = state.machine === name ? "" : name;
  render();
});
$("sessions").addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if(!b) return;
  copy(b.dataset.copy || "");
});
$("binlist").addEventListener("click", e => {
  const el = e.target.closest("[data-bin]"); if(!el) return;
  openBin(el.dataset.bin);
});
$("filter").addEventListener("input", e => { state.filter = e.target.value; render(); });
$("pause").addEventListener("click", () => {
  state.paused = !state.paused;
  $("pause").textContent = state.paused ? "resume" : "pause";
  $("pause").classList.toggle("primary", state.paused);
  if(state.paused) clearInterval(state.timer); else startTimer();
});
$("newpaste").addEventListener("click", () => {
  $("c-title").value = ""; $("c-body").value = ""; $("composer").classList.add("on"); $("c-body").focus();
});

async function openBin(id){
  const r = await fetch("/api/bins/" + encodeURIComponent(id));
  if(!r.ok){ toast("bin gone"); return; }
  const b = await r.json();
  state.viewing = b;
  $("v-title").textContent = b.title;
  $("v-meta").textContent = `${b.machine||"local"} · ${bytes(b.bytes)} · ${new Date(b.created_at).toLocaleString()}`;
  $("v-body").textContent = b.body;
  $("viewer").classList.add("on");
}
$("v-close").addEventListener("click", () => $("viewer").classList.remove("on"));
$("v-copy").addEventListener("click", () => state.viewing && copy(state.viewing.body));
$("v-del").addEventListener("click", async () => {
  if(!state.viewing) return;
  if(!confirm("Delete this paste?")) return;
  await fetch("/api/bins/" + encodeURIComponent(state.viewing.id), {method:"DELETE"});
  $("viewer").classList.remove("on"); state.viewing = null; load();
});
$("c-close").addEventListener("click", () => $("composer").classList.remove("on"));
$("c-cancel").addEventListener("click", () => $("composer").classList.remove("on"));
$("c-save").addEventListener("click", async () => {
  const body = $("c-body").value;
  if(!body.trim()){ toast("nothing to save"); return; }
  const r = await fetch("/api/bins", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({title:$("c-title").value, body})});
  if(r.ok){ $("composer").classList.remove("on"); toast("saved"); load(); }
  else { toast((await r.json()).error || "save failed"); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ $("viewer").classList.remove("on"); $("composer").classList.remove("on"); }
  if(e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA"){
    e.preventDefault(); $("filter").focus();
  }
});
document.addEventListener("visibilitychange", () => {
  if(document.hidden) clearInterval(state.timer);
  else if(!state.paused) startTimer();
});

function startTimer(){
  clearInterval(state.timer);
  state.timer = setInterval(() => { if(!document.hidden) load(); }, 3000);
}
load();
startTimer();
</script>
</body>
</html>
